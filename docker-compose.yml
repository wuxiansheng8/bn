# 币安极速多IP监控与自动跟单系统 v3.1
# 兼容 Docker Compose V2（docker compose）与 V1（docker-compose 1.29+）。
# V2 会提示 "the attribute `version` is obsolete"，属于为兼容 V1 保留的正常提示，可忽略。
version: "3.8"

services:
  copybot:
    build:
      context: .
      dockerfile: Dockerfile
    image: binance-copybot:3.1
    container_name: copybot

    # host 网络：容器直接复用宿主机网卡与路由，不做 NAT，保证容器内网络延迟与宿主机一致。
    network_mode: host

    restart: unless-stopped

    environment:
      # 端口由 install.sh / update.sh 写入 .env 并导出；未设置时回退 8080。
      COPYBOT_PORT: "${COPYBOT_PORT:-8080}"
      TZ: Asia/Shanghai

    volumes:
      # 配置、SQLite、keyfile 全部落宿主机，重建 / 升级容器不丢数据。
      - ./data:/app/data

    # host 模式下无需 ports 映射，uvicorn 直接监听宿主机端口。
    command:
      - sh
      - -c
      - exec uvicorn backend.main:app --host 0.0.0.0 --port ${COPYBOT_PORT:-8080}

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,urllib.request; p=int(os.environ.get('COPYBOT_PORT','8080')); urllib.request.urlopen('http://127.0.0.1:%d/api/health' % p, timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    # 防止 docker logs 无限增长，最多保留 3 × 10MB。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # v3.3：TG 频道信号采集（独立容器，与 copybot 共用同一个镜像与 data/）
  #  - 独立进程：TG 断线/崩溃不影响下单主流程
  #  - 只通过 data/copybot.db 的 signals 表与主程序通信
  #  - ./tg 挂进容器：改 config.json 后 `docker restart tgcollector` 即生效，无需重建镜像
  tgcollector:
    image: binance-copybot:3.1
    container_name: tgcollector
    network_mode: host
    restart: unless-stopped
    depends_on:
      - copybot
    environment:
      TZ: Asia/Shanghai
      COPYBOT_DB: /app/data/copybot.db
    volumes:
      - ./data:/app/data
      - ./tg:/app/tg
    command: ["python", "-m", "tg.collector", "run"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
